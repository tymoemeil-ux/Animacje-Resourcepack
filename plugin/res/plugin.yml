name: AnimacjeHub
version: 2.0.0
main: dev.tymek24.animacje.Animacje
api-version: '1.21'
authors: [tymek24]
description: "Animacje 2.0 Hub - 256 FX, nick animowany, itemy, trolle, glosy (1.21-26.3)"
softdepend: [LuckPerms]

commands:
  anim:
    description: Animacje Hub (menu, fx, nick, item, troll, glos)
    usage: /anim [fx|nick|item|troll|kolor|glos|lista|gui|info|reload]
    aliases: [an, animacje]

permissions:
  animacje.uzywanie:
    description: Bazowe komendy /anim
    default: true
  animacje.glos:
    description: /anim glos (ogloszenia do wszystkich)
    default: op
  animacje.troll.inny:
    description: Trollowanie innych graczy
    default: op
  animacje.admin:
    description: /anim reload
    default: op
