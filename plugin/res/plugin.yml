name: AnimacjeHub
version: 3.0.0
main: dev.tymek24.animacje.Animacje
api-version: '1.21'
authors: [tymek24]
description: "Animacje Hub - 50 curated FX, animated nick, titles, items and safe pranks"
softdepend: [LuckPerms]

commands:
  anim:
    description: Animacje Hub (menu, fx, nick, item, troll, glos)
    usage: /anim [fx|nick|item|title|troll|kolor|glos|lista|gui|info|reload]
    aliases: [an, animacje]

permissions:
  animacje.uzywanie:
    description: Bazowe komendy /anim
    default: true
  animacje.glos:
    description: /anim glos (ogloszenia do wszystkich)
    default: op
  animacje.troll.inny:
    description: Trollowanie innych graczy
    default: op
  animacje.title:
    description: Wysylanie animowanych tytulow
    default: true
  animacje.admin:
    description: /anim reload
    default: op
