name: Build AnimacjeHub

on:
  workflow_dispatch:
  push:
    paths:
      - 'plugin/**'
      - '.github/workflows/build-plugin.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - '.github/workflows/build-plugin.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build plugin
        working-directory: plugin
        run: ./build.sh
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: AnimacjeHub-v2
          path: plugin/AnimacjeHub.jar
          if-no-files-found: error
      - name: Update tracked jar on manual build
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- plugin/AnimacjeHub.jar; then
            echo "Jar is already current"
            exit 0
          fi
          git add plugin/AnimacjeHub.jar
          git commit -m "Build AnimacjeHub.jar [skip ci]"
          git push
