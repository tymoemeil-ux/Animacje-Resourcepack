name: Build AnimacjeHub

on:
  workflow_dispatch:
  push:
    paths:
      - 'plugin/**'
      - '.github/workflows/build-plugin.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - '.github/workflows/build-plugin.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build plugin
        working-directory: plugin
        run: ./build.sh
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: AnimacjeHub-v2
          path: plugin/AnimacjeHub.jar
          if-no-files-found: error

